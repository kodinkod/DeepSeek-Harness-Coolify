services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL}       # https://dsh.example.com/
      - TRUSTED_HOST=${TRUSTED_HOST}   # dsh.example.com
      - DSH_HOST=${DSH_HOST:-}         # optional: bind address override
    volumes:
      - dsh-home:/data/dsh
      - dsh-workspace:/workspace
    labels:
      # Basic auth in front of dsh. Coolify does not interpolate env vars in
      # labels, so the password hash lives in a Traefik dynamic config on the
      # server (Servers -> Proxy -> Dynamic Configurations, middleware
      # "dsh-basic"). Coolify attaches middlewares defined here to its routers.
      # If that file is missing, the router fails closed with 404.
      - "traefik.http.middlewares.dsh-auth.chain.middlewares=dsh-basic@file"

volumes:
  dsh-home:
  dsh-workspace:

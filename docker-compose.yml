services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL}       # https://dsh.example.com/
      - TRUSTED_HOST=${TRUSTED_HOST}   # dsh.example.com
      - DSH_HOST=${DSH_HOST:-}         # optional: bind address override
    volumes:
      - dsh-home:/data/dsh
      - dsh-workspace:/workspace
    labels:
      # Basic auth in front of dsh. DSH_BASIC_AUTH is the raw `htpasswd -nB` line
      # (single `$`, no doubling). If it is empty, Traefik rejects the middleware
      # and the router stays closed: fail closed, not open.
      - "traefik.http.middlewares.dsh-auth.basicauth.users=${DSH_BASIC_AUTH}"
      # Router name Coolify generates: https-<domain index>-<resource uuid>-<service>.
      # Check it in "Show Deployable Compose" and set DSH_TRAEFIK_ROUTER if it differs.
      - "traefik.http.routers.${DSH_TRAEFIK_ROUTER:-https-0-m3q6crdtosbqlmit5uadhii5-dsh}.middlewares=dsh-auth"

volumes:
  dsh-home:
  dsh-workspace:

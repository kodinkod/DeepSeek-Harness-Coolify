services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.5}
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL}       # https://dsh.example.com/
      - TRUSTED_HOST=${TRUSTED_HOST}   # dsh.example.com
      - DSH_HOST=${DSH_HOST:-}         # optional: bind address override
    volumes:
      - dsh-home:/data/dsh
      - dsh-workspace:/workspace
    labels:
      # Basic auth in front of dsh. DSH_BASIC_AUTH is the raw `htpasswd -nB` line
      # (single `$`, no doubling). Coolify attaches middlewares defined here to the
      # routers it generates, so no router name is needed (and Coolify does not
      # interpolate variables in label keys anyway).
      - "traefik.http.middlewares.dsh-auth.basicauth.users=${DSH_BASIC_AUTH}"

volumes:
  dsh-home:
  dsh-workspace:
